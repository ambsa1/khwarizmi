<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>خوارزمي</title><meta http-equiv="refresh" content="0; url=../">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4E3C1;color:#2B2118;font:20px system-ui,sans-serif}a{color:#1F5FAD}</style></head>
<body><a href="../">افتح خوارزمي</a>
<script>
  // the old version lived here; clear its offline copy from this device and open the new app
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (/\/v2\//.test(r.scope)) r.unregister(); }); });
  if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (!/^workbox|^worlds|^content/.test(k)) caches.delete(k); }); });
  location.replace('../');
</script></body></html>
