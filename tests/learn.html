<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>اختبار دفتر البرمجة</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/learn.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal"></div>
  <canvas id="fx"></canvas>
  <script>
    // ?fast=N يسرّع المؤقّتات للاختبار، ?page=... الصفحة، ?g=g بنت، ?done=1 كل الصفحات منجزة
    (function () {
      var F = +(new URLSearchParams(location.search).get('fast') || 1);
      window.__fast = F;
      if (F > 1) {
        var st = window.setTimeout, si = window.setInterval;
        window.setTimeout = function (fn, ms) { var a = [].slice.call(arguments, 2); return st.apply(window, [fn, (ms || 0) / F].concat(a)); };
        window.setInterval = function (fn, ms) { var a = [].slice.call(arguments, 2); return si.apply(window, [fn, (ms || 0) / F].concat(a)); };
      }
    })();
  </script>
  <script src="../vendor/gsap.min.js"></script>
  <script src="../voice/list.js"></script>
  <script src="../js/sfx.js"></script>
  <script src="../js/siraj.js"></script>
  <script src="../js/activities.js"></script>
  <script src="../js/learn/texts.js"></script>
  <script src="../js/learn/core.js"></script>
  <script src="../js/learn/pages.js"></script>
  <script>
    if (window.__fast > 1) gsap.globalTimeline.timeScale(window.__fast);
    var qs = new URLSearchParams(location.search);
    window.__said = []; window.__missing = []; window.__saved = {}; window.__backs = 0;
    var player = { name: 'تجربة', age: +(qs.get('age') || 9), gender: qs.get('g') || 'b', color: '#3d8bff', progress: {} };
    if (qs.get('done')) LEARN.pages.forEach(function (p) { player.progress[LEARN.saveKey(p.id)] = 3; });
    var ctx = {
      player: player,
      playSeq: function (items) {
        items.forEach(function (it) {
          window.__said.push(it[0]);
          if (!it[1] || !LEARN_TEXTS[it[0]] || it[0].indexOf('lr_') !== 0) window.__missing.push(it[0]);
        });
      },
      say: function (k, t) { this.playSeq([[k, t]]); },
      sfx: Sfx, Siraj: Siraj, fx: FX,
      saveProgress: function (id, stars) { window.__saved[id] = Math.max(window.__saved[id] || 0, stars); player.progress[id] = Math.max(player.progress[id] || 0, stars); },
      back: function () { window.__backs++; },
    };
    LEARN.render(document.getElementById('app'), ctx, { page: qs.get('page') || 'notebook', back: function () { window.__backs++; } });
  </script>
</body>
</html>
