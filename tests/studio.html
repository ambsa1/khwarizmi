<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>اختبار استوديو سراج</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/studio.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal"></div>
  <canvas id="fx"></canvas>
  <script>
    // ?fast=N يسرّع المؤقّتات للاختبار
    (function () {
      var F = +(new URLSearchParams(location.search).get('fast') || 1);
      window.__fast = F;
      if (F > 1) {
        var st = window.setTimeout, si = window.setInterval;
        window.setTimeout = function (fn, ms) { var a = [].slice.call(arguments, 2); return st.apply(window, [fn, (ms || 0) / F].concat(a)); };
        window.setInterval = function (fn, ms) { var a = [].slice.call(arguments, 2); return si.apply(window, [fn, (ms || 0) / F].concat(a)); };
      }
    })();
  </script>
  <script src="../vendor/gsap.min.js"></script>
  <script src="../vendor/blockly/blockly_compressed.js"></script>
  <script src="../vendor/blockly/blocks_compressed.js"></script>
  <script src="../vendor/blockly/python_compressed.js"></script>
  <script src="../vendor/blockly/msg/ar.js"></script>
  <script src="../voice/list.js"></script>
  <script src="../js/texts.js"></script>
  <script src="../js/sfx.js"></script>
  <script src="../js/siraj.js"></script>
  <script src="../js/crypt.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/blocks.js"></script>
  <script src="../js/activities.js"></script>
  <script src="../js/studio/texts.js"></script>
  <script src="../js/studio/core.js"></script>
  <script>
    if (window.__fast > 1) gsap.globalTimeline.timeScale(window.__fast);
    var qs = new URLSearchParams(location.search);
    window.__said = []; window.__missing = []; window.__backs = 0;
    // الحفظ الحقيقي (localStorage) عشان نختبر إعادة التحميل
    Store.load();
    var player = Store.data.players.find(function (p) { return p.name === 'تجربة'; }) || Store.addPlayer({ name: 'تجربة', age: +(qs.get('age') || 9), gender: qs.get('g') || 'b', color: '#3d8bff' });
    Voice.who = function () { return player; };
    var ctx = {
      player: player,
      playSeq: function (items) { items.forEach(function (it) { window.__said.push(it[0]); if (!it[1]) window.__missing.push(it[0]); }); },
      say: function (k, t) { this.playSeq([[k, t]]); },
      sfx: Sfx, Siraj: Siraj, fx: FX,
      saveProgress: function (id, stars) { Store.win(player, id, stars); },
      back: function () { window.__backs++; },
    };
    window.__ctx = ctx; window.__player = player;
    STUDIO.render(document.getElementById('app'), ctx);
  </script>
</body>
</html>
