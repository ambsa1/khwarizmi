<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>اختبار الرياضيات</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/math.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal"></div>
  <canvas id="fx"></canvas>
  <script>
    // ?fast=N يسرّع المؤقّتات للاختبار
    (function () {
      var F = +(new URLSearchParams(location.search).get('fast') || 1);
      window.__fast = F;
      if (F > 1) {
        var st = window.setTimeout, si = window.setInterval;
        window.setTimeout = function (fn, ms) { var a = [].slice.call(arguments, 2); return st.apply(window, [fn, (ms || 0) / F].concat(a)); };
        window.setInterval = function (fn, ms) { var a = [].slice.call(arguments, 2); return si.apply(window, [fn, (ms || 0) / F].concat(a)); };
      }
    })();
  </script>
  <script src="../vendor/gsap.min.js"></script>
  <script src="../voice/list.js"></script>
  <script src="../js/texts.js"></script>
  <script src="../js/sfx.js"></script>
  <script src="../js/siraj.js"></script>
  <script src="../js/activities.js"></script>
  <script src="../js/math/texts.js"></script>
  <script src="../js/math/core.js"></script>
  <script src="../js/math/art.js"></script>
  <script src="../js/math/numbers.js"></script>
  <script src="../js/math/shapes.js"></script>
  <script src="../js/math/addsub.js"></script>
  <script src="../js/math/mult.js"></script>
  <script src="../js/math/measure.js"></script>
  <script src="../js/math/frac.js"></script>
  <script src="../js/math/speed.js"></script>
  <script>
    if (window.__fast > 1) gsap.globalTimeline.timeScale(window.__fast);
    var qs = new URLSearchParams(location.search);
    window.__said = []; window.__missing = []; window.__saved = {}; window.__backs = 0; window.__seqs = [];
    var player = { name: 'تجربة', age: +(qs.get('age') || 9), gender: qs.get('g') || 'b', color: '#3d8bff', progress: {} };
    var ctx = {
      player: player,
      // الصوت في الاختبار: نسجّل المفاتيح ونتأكد أن لكل مفتاح نصاً (m_ من MATH_TEXTS و n_ من الأرقام الموجودة)
      playSeq: function (items, o) {
        window.__seqs.push({ keys: items.map(function (it) { return it[0]; }), pri: o && o.pri });
        items.forEach(function (it) { window.__said.push(it[0]); if (!it[1] || !MATH.textOf(it[0])) window.__missing.push(it[0]); });
      },
      say: function (k, t) { this.playSeq([[k, t]]); },
      sfx: Sfx, Siraj: Siraj, fx: FX,
      // المفتاح يصل كاملاً: math:<id>
      saveProgress: function (key, stars) { window.__saved[key] = Math.max(window.__saved[key] || 0, stars); player.progress[key] = Math.max(player.progress[key] || 0, stars); },
      back: function () { window.__backs++; },
    };
    MATH.render(document.getElementById('app'), ctx);
  </script>
</body>
</html>
