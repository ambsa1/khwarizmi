<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1f45">
<title>بيت الخوارزمي: نموذج تجريبي</title>
<style>
@font-face { font-family: "Baloo"; src: url(fonts/baloo-arabic.woff2) format("woff2"); font-weight: 400 800; font-display: swap;
  unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200E, U+2010-2011, U+204F, U+2E41; }
@font-face { font-family: "Baloo"; src: url(fonts/baloo-latin.woff2) format("woff2"); font-weight: 400 800; font-display: swap; }

:root {
  --sky1: #2b2f7a; --sky2: #141738; --gold: #ffc531; --glow: #ffe48a; --ink: #22223b;
  --grass1: #7bd36a; --grass2: #6cc65b; --grassF: #3f8f3a; --tray: #fff8ec;
  --blue: #3d8bff; --blueD: #2462c9; --orange: #ff9a2e; --orangeD: #d06f0c; --green: #22c26a; --greenD: #15924d;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky2); }
body { font-family: "Baloo", "Segoe UI", Tahoma, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { font: inherit; border: 0; cursor: pointer; color: inherit; }
.app { height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }

/* السماء والمسرح */
.stage { flex: 1; position: relative; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, var(--sky1), var(--sky2) 70%); transition: background 1.2s; }
.stage::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent), radial-gradient(1.5px 1.5px at 90px 80px, #fff, transparent), radial-gradient(1px 1px at 150px 20px, #fff, transparent), radial-gradient(1.5px 1.5px at 210px 110px, #fff, transparent), radial-gradient(1px 1px at 280px 50px, #fff, transparent);
  background-size: 300px 160px; opacity: .55; animation: twinkle 4s ease-in-out infinite alternate; }
.stage.lit { background: radial-gradient(120% 90% at 50% 0%, #ffb35c, #ff7a6b 40%, #6b4fd3 85%); }
.stage.lit::before { opacity: .1; }
@keyframes twinkle { to { opacity: .25; } }

.hud { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top)); z-index: 20; color: #fff; }
.hud .title { flex: 1; font-weight: 800; font-size: 20px; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.chip { background: rgba(255,255,255,.14); backdrop-filter: blur(6px); border-radius: 999px; padding: 6px 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; font-size: 16px; }
.chip.btn { width: 44px; height: 44px; justify-content: center; padding: 0; font-size: 20px; }
.sparks { display: flex; gap: 4px; }
.sparks i { width: 22px; height: 22px; display: inline-block; opacity: .3; transition: transform .3s, opacity .3s; }
.sparks i.got { opacity: 1; animation: pop .45s; }
.sparks svg { width: 100%; height: 100%; }

.bubble { position: absolute; top: 70px; right: 14px; left: 14px; z-index: 19; background: #fff; border-radius: 18px; padding: 10px 14px; font-size: 17px; font-weight: 700; line-height: 1.5;
  box-shadow: 0 8px 24px rgba(0,0,0,.25); display: flex; gap: 10px; align-items: center; transition: opacity .3s, transform .3s; }
.bubble.hide { opacity: 0; transform: translateY(-10px); pointer-events: none; }
.bubble.bad { background: #ffe9e4; }
.bubble.good { background: #e8ffe9; }
.bubble .face { width: 42px; height: 42px; flex: none; }

/* اللوحة */
.board { position: absolute; left: 50%; top: calc(50% + 62px); transform: translate(-50%, -50%); }
.tile { position: absolute; border-radius: 12px; }
.tile .top { position: absolute; inset: 0 0 auto 0; border-radius: 12px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.35); }
.tile .front { position: absolute; left: 0; right: 0; border-radius: 0 0 12px 12px; background: linear-gradient(#5a3d2a, #3f2a1c); }
.tile .front::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 35%; background: var(--grassF); border-radius: 0 0 6px 6px; }
.obj { position: absolute; transform: translate(-50%, -100%); pointer-events: none; }
.shadow { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(0,0,0,.22); pointer-events: none; }
.spark { animation: float 1.6s ease-in-out infinite; filter: drop-shadow(0 0 10px rgba(255,214,90,.9)); }
@keyframes float { 50% { transform: translate(-50%, -112%) rotate(8deg); } }
.lamp-glow { position: absolute; border-radius: 50%; transform: translate(-50%, -50%) scale(0); background: radial-gradient(circle, rgba(255,232,140,.95), rgba(255,200,60,.4) 40%, transparent 70%); pointer-events: none; transition: transform 1s cubic-bezier(.2,1.4,.4,1); }
.lamp-glow.on { transform: translate(-50%, -50%) scale(1); }
.target { animation: beckon 1.4s ease-in-out infinite; }
@keyframes beckon { 50% { filter: drop-shadow(0 0 12px rgba(255,230,140,.8)); } }

.siraj { position: absolute; pointer-events: none; will-change: transform; }
.siraj .body { transform-origin: 50% 100%; animation: idle 1.8s ease-in-out infinite; }
.siraj.moving .body { animation: none; }
@keyframes idle { 50% { transform: scale(1.03, .97); } }
.dizzy { position: absolute; left: 50%; top: -6%; width: 60%; transform: translateX(-50%); animation: spin 1s linear infinite; font-size: 18px; text-align: center; }
@keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }
.puff { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.75); pointer-events: none; animation: puff .5s forwards; }
@keyframes puff { to { transform: translate(var(--dx), -14px) scale(1.8); opacity: 0; } }

/* صينية البرنامج */
.tray { background: var(--tray); border-radius: 28px 28px 0 0; padding: 12px 14px 14px; padding-bottom: max(14px, env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(0,0,0,.25); position: relative; z-index: 5; }
.tray-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 800; color: #8a7a5c; font-size: 15px; }
.toggle { background: #efe4cf; border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 700; color: #6b5a3a; }
.toggle.on { background: #22223b; color: #ffe48a; }
.seq { direction: ltr; display: flex; flex-wrap: wrap; gap: 8px; min-height: 66px; background: #f1e6d1; border-radius: 18px; padding: 8px; align-items: center; }
.seq .empty { width: 54px; height: 54px; border-radius: 14px; border: 3px dashed #d4c3a2; display: flex; align-items: center; justify-content: center; color: #c3ae86; font-size: 22px; }
.blk { width: 54px; height: 54px; border-radius: 16px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; animation: drop .35s cubic-bezier(.2,1.6,.4,1); }
.blk svg { width: 30px; height: 30px; }
.blk.b { background: linear-gradient(#5aa0ff, var(--blue)); box-shadow: 0 4px 0 var(--blueD); }
.blk.o { background: linear-gradient(#ffb35c, var(--orange)); box-shadow: 0 4px 0 var(--orangeD); }
.blk.now { transform: translateY(-6px) scale(1.12); box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--gold), 0 6px 0 rgba(0,0,0,.2); }
.blk.bad { box-shadow: 0 0 0 4px #fff, 0 0 0 7px #ff5a4f; animation: shake .4s; }
.blk code { font-family: Consolas, "Courier New", monospace; font-size: 9px; font-weight: 700; opacity: .9; margin-top: -2px; }
@keyframes drop { from { transform: translateY(-30px) scale(.4); opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes pop { 40% { transform: scale(1.5); } }

.pal { direction: ltr; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
.pal button { height: 70px; border-radius: 20px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform .1s; }
.pal button svg { width: 38px; height: 38px; }
.pal button code { font-family: Consolas, monospace; font-size: 11px; font-weight: 700; opacity: .9; }
.pal button:active { transform: translateY(3px); box-shadow: none !important; }
.controls { display: flex; gap: 10px; margin-top: 12px; }
.run { flex: 1; height: 62px; border-radius: 20px; background: linear-gradient(#3ee08a, var(--green)); box-shadow: 0 5px 0 var(--greenD); color: #fff; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
.run.stop { background: linear-gradient(#ff8a7a, #ff5a4f); box-shadow: 0 5px 0 #c23a30; }
.run:active { transform: translateY(3px); box-shadow: none; }
.sq { width: 62px; height: 62px; border-radius: 20px; background: #efe4cf; box-shadow: 0 4px 0 #d8c8a8; font-size: 26px; display: flex; align-items: center; justify-content: center; }
.sq:active { transform: translateY(3px); box-shadow: none; }
.code-view { direction: ltr; text-align: left; background: #22223b; color: #e9e6ff; border-radius: 14px; padding: 8px 12px; margin-top: 8px; font-family: Consolas, monospace; font-size: 15px; max-height: 90px; overflow: auto; display: none; }
.code-view.show { display: block; }
.code-view span.cur { background: #ffc531; color: #22223b; border-radius: 4px; }

canvas.fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.win { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(20,20,50,.45); opacity: 0; pointer-events: none; transition: opacity .4s; }
.win.show { opacity: 1; pointer-events: auto; }
.win .card { background: #fff; border-radius: 28px; padding: 22px; text-align: center; max-width: 360px; width: 100%; transform: scale(.7); transition: transform .5s cubic-bezier(.2,1.6,.4,1); }
.win.show .card { transform: scale(1); }
.win h2 { margin: 6px 0; font-size: 30px; color: #15924d; }
.win p { margin: 4px 0 14px; font-size: 18px; }
.win .stars { font-size: 46px; letter-spacing: 6px; }
.win .stars span { display: inline-block; animation: pop .6s backwards; }
.win .stars span:nth-child(2) { animation-delay: .2s; } .win .stars span:nth-child(3) { animation-delay: .4s; }
.note { position: fixed; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 11px; color: #9aa; z-index: 1; pointer-events: none; }
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <div class="hud">
      <span class="chip btn">→</span>
      <span class="title">المرحلة ١</span>
      <span class="chip"><span class="sparks" id="sparks"></span></span>
      <button class="chip btn" id="hintBtn" aria-label="تلميح">💡</button>
    </div>
    <div class="bubble" id="bubble"><svg class="face" viewBox="0 0 120 120" id="bubbleFace"></svg><span id="bubbleText"></span></div>
    <div class="board" id="board"></div>
  </section>

  <section class="tray">
    <div class="tray-head"><span>برنامج سراج</span>
      <span style="display:flex;gap:6px"><button class="toggle" id="kidsBtn">🧸 وضع الصغار</button><button class="toggle" id="codeBtn">👁 كود بايثون</button></span></div>
    <div class="seq" id="seq"></div>
    <div class="code-view" id="codeView"></div>
    <div class="pal" id="pal"></div>
    <div class="controls">
      <button class="run" id="runBtn">▶ شغّل</button>
      <button class="sq" id="undoBtn" aria-label="تراجع">↶</button>
      <button class="sq" id="clearBtn" aria-label="امسح">🗑</button>
    </div>
  </section>
</div>
<div class="win" id="win"><div class="card">
  <svg viewBox="0 0 120 120" width="110" height="110" id="winFace"></svg>
  <h2>المدينة نوّرت! 🎉</h2>
  <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <p>أحسنت! سراج أضاء المصباح الأول.</p>
  <button class="run" id="againBtn" style="width:100%">↻ العب مرة أخرى</button>
</div></div>
<canvas class="fx" id="fx"></canvas>
<div class="note">نموذج تجريبي لمرحلة واحدة. الصوت والمراحل الكاملة في البناء الحقيقي.</div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ---------- الرسومات ---------- */
// سراج من الأمام. mood: happy | sad | wow | dizzy. lit: المصباح منوّر
function sirajSVG(mood = 'happy', lit = true, color = '#3d8bff') {
  const dark = '#1f3f8f';
  const mouth = { happy: '<path d="M50 70 Q60 79 70 70" stroke="#1d2433" stroke-width="4" fill="none" stroke-linecap="round"/>',
    sad: '<path d="M50 75 Q60 67 70 75" stroke="#1d2433" stroke-width="4" fill="none" stroke-linecap="round"/>',
    wow: '<ellipse cx="60" cy="73" rx="5" ry="6" fill="#1d2433"/>',
    dizzy: '<path d="M50 73 Q55 69 60 73 T70 73" stroke="#1d2433" stroke-width="4" fill="none" stroke-linecap="round"/>' }[mood];
  const eyes = mood === 'dizzy'
    ? '<path d="M42 52 l10 10 M52 52 l-10 10 M68 52 l10 10 M78 52 l-10 10" stroke="#1d2433" stroke-width="4" stroke-linecap="round"/>'
    : '<g class="eyes"><ellipse cx="47" cy="57" rx="8" ry="9.5" fill="#1d2433"/><ellipse cx="73" cy="57" rx="8" ry="9.5" fill="#1d2433"/><circle cx="50" cy="53" r="3" fill="#fff"/><circle cx="76" cy="53" r="3" fill="#fff"/></g>';
  return `${lit ? '<circle cx="60" cy="13" r="17" fill="#ffe48a" opacity=".45"/>' : ''}
    <rect x="56" y="18" width="8" height="12" rx="3" fill="#a7b0c8"/>
    <circle cx="60" cy="13" r="9.5" fill="${lit ? '#ffd23e' : '#9a9580'}" stroke="${lit ? '#f0a500' : '#77735f'}" stroke-width="2.5"/>
    <ellipse cx="57" cy="10" rx="3" ry="2" fill="#fff" opacity=".7"/>
    <rect x="12" y="50" width="12" height="24" rx="6" fill="${color}" stroke="${dark}" stroke-width="3"/>
    <rect x="96" y="50" width="12" height="24" rx="6" fill="${color}" stroke="${dark}" stroke-width="3"/>
    <rect x="20" y="28" width="80" height="62" rx="28" fill="${color}" stroke="${dark}" stroke-width="3.5"/>
    <rect x="30" y="38" width="60" height="42" rx="18" fill="#eaf4ff"/>
    <circle cx="37" cy="70" r="4.5" fill="#ff9db0" opacity=".8"/><circle cx="83" cy="70" r="4.5" fill="#ff9db0" opacity=".8"/>
    ${eyes}${mouth}
    <rect x="38" y="88" width="44" height="24" rx="11" fill="${color}" stroke="${dark}" stroke-width="3.5"/>
    <circle cx="60" cy="100" r="5" fill="#ffd23e" stroke="#f0a500" stroke-width="2"/>`;
}
const sparkSVG = '<svg viewBox="0 0 40 40"><path d="M20 2 L25 15 L38 20 L25 25 L20 38 L15 25 L2 20 L15 15Z" fill="#ffd23e" stroke="#f0a500" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="20" r="5" fill="#fff8d6"/></svg>';
const crateSVG = '<svg viewBox="0 0 60 60"><rect x="4" y="12" width="52" height="44" rx="6" fill="#c98a4b" stroke="#7a4d22" stroke-width="3"/><rect x="4" y="6" width="52" height="12" rx="5" fill="#dca266" stroke="#7a4d22" stroke-width="3"/><path d="M10 22 L50 50 M50 22 L10 50" stroke="#7a4d22" stroke-width="3.5" stroke-linecap="round"/></svg>';
const lampSVG = lit => `<svg viewBox="0 0 40 100"><rect x="17" y="30" width="6" height="64" rx="3" fill="#4b4f6e"/><rect x="9" y="90" width="22" height="8" rx="4" fill="#3a3d58"/>
  <path d="M6 30 L34 30 L28 6 L12 6Z" fill="${lit ? '#ffd23e' : '#6d7192'}" stroke="${lit ? '#f0a500' : '#4b4f6e'}" stroke-width="3" stroke-linejoin="round"/>
  <rect x="10" y="2" width="20" height="6" rx="3" fill="#4b4f6e"/>${lit ? '<circle cx="20" cy="18" r="9" fill="#fff6c8"/>' : ''}</svg>`;
const ARROW = { up: 'M20 34 V8 M9 18 L20 6 L31 18', down: 'M20 6 V32 M9 22 L20 34 L31 22', left: 'M34 20 H8 M18 9 L6 20 L18 31', right: 'M6 20 H32 M22 9 L34 20 L22 31' };
const arrowSVG = d => `<svg viewBox="0 0 40 40"><path d="${ARROW[d]}" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- المرحلة ---------- */
// . أرض   # صندوق   s شرارة   L المصباح   R بداية سراج
const LEVEL = ['....L', '.#.#s', '.s.s.', 'R....'];
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const COLOR = { up: 'b', down: 'b', left: 'o', right: 'o' };
const ROWS = LEVEL.length, COLS = LEVEL[0].length;
let C = 64, R = 50, F = 16; // عرض المربع، ارتفاع سطحه، سُمك جانبه
let state, program = [], running = false, kidsMode = false, showCode = false;

function reset() {
  state = { x: 0, y: 0, face: 1, got: new Set(), lit: false };
  LEVEL.forEach((row, y) => [...row].forEach((c, x) => { if (c === 'R') { state.x = x; state.y = y; } }));
  $('#stage').classList.remove('lit');
  renderBoard();
  renderSparks();
}
const sparkCells = [];
LEVEL.forEach((row, y) => [...row].forEach((c, x) => { if (c === 's') sparkCells.push(x + ',' + y); }));

function layout() {
  const st = $('#stage').getBoundingClientRect();
  C = Math.floor(Math.min((st.width - 24) / COLS, (st.height - 230) / (ROWS * .78 + .3), 92));
  R = Math.round(C * .78); F = Math.round(C * .24);
}

function cellPos(x, y) { return [x * C + C / 2, y * R + R / 2]; }

function renderBoard() {
  layout();
  const b = $('#board');
  b.style.width = COLS * C + 'px';
  b.style.height = ROWS * R + F + 'px';
  let h = '';
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const top = (x + y) % 2 ? 'var(--grass2)' : 'var(--grass1)';
    h += `<div class="tile" style="left:${x * C + 2}px;top:${y * R + 2}px;width:${C - 4}px;height:${R + F - 4}px;z-index:${y * 10}">
      <div class="front" style="top:${R - 14}px;height:${F + 10}px"></div>
      <div class="top" style="height:${R - 4}px;background:${top}"></div></div>`;
  }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = LEVEL[y][x], [px, py] = cellPos(x, y), z = y * 10 + 5;
    if (c === '#') h += `<div class="shadow" style="left:${px}px;top:${py + R * .25}px;width:${C * .7}px;height:${R * .3}px;z-index:${z}"></div>
      <div class="obj" style="left:${px}px;top:${py + R * .3}px;width:${C * .78}px;z-index:${z}">${crateSVG}</div>`;
    if (c === 's' && !state.got.has(x + ',' + y)) h += `<div class="obj spark" id="s-${x}-${y}" style="left:${px}px;top:${py}px;width:${C * .5}px;z-index:${z}">${sparkSVG}</div>`;
    if (c === 'L') h += `<div class="lamp-glow ${state.lit ? 'on' : ''}" id="glow" style="left:${px}px;top:${py - R * 1.1}px;width:${C * 4}px;height:${C * 4}px;z-index:2"></div>
      <div class="shadow" style="left:${px}px;top:${py + R * .25}px;width:${C * .45}px;height:${R * .22}px;z-index:${z}"></div>
      <div class="obj ${state.lit ? '' : 'target'}" id="lamp" style="left:${px}px;top:${py + R * .3}px;width:${C * .42}px;z-index:${z}">${lampSVG(state.lit)}</div>`;
  }
  h += `<div class="shadow" id="sShadow" style="width:${C * .62}px;height:${R * .26}px"></div>
    <div class="siraj" id="siraj" style="width:${C * .92}px;height:${C * .92}px"><svg class="body" viewBox="0 0 120 120" id="sirajSvg">${sirajSVG('happy', true)}</svg></div>`;
  b.innerHTML = h;
  placeSiraj(state.x, state.y, 0);
}

function placeSiraj(x, y, lift, sx = 1, sy = 1) {
  const [px, py] = cellPos(x, y), s = $('#siraj'), sh = $('#sShadow');
  const w = C * .92;
  s.style.left = px - w / 2 + 'px';
  s.style.top = py - w * .78 - lift + 'px';
  s.style.zIndex = Math.round(y) * 10 + 7;
  s.style.transform = `scale(${state.face * sx}, ${sy})`;
  s.style.transformOrigin = '50% 100%';
  sh.style.left = px + 'px'; sh.style.top = py + R * .2 + 'px'; sh.style.zIndex = Math.round(y) * 10 + 6;
  sh.style.opacity = Math.max(.25, 1 - lift / (C * 1.2));
}
const face = mood => { $('#sirajSvg').innerHTML = sirajSVG(mood, true); };

/* ---------- الحركة ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function tween(ms, fn) {
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => { const t = Math.min(1, (now - t0) / ms); fn(t); if (t < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
}
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

async function hop(dir) {
  const [dx, dy] = DIRS[dir];
  if (dx) state.face = dx < 0 ? -1 : 1;
  const nx = state.x + dx, ny = state.y + dy;
  const blocked = nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || LEVEL[ny][nx] === '#';
  $('#siraj').classList.add('moving');
  // تحضير للنطّة
  await tween(90, t => placeSiraj(state.x, state.y, 0, 1 + .12 * t, 1 - .15 * t));
  if (blocked) {
    sfx.bump();
    await tween(160, t => placeSiraj(state.x + dx * .3 * Math.sin(Math.PI * t), state.y + dy * .3 * Math.sin(Math.PI * t), C * .25 * Math.sin(Math.PI * t)));
    shakeStage();
    face('dizzy');
    const d = document.createElement('div'); d.className = 'dizzy'; d.textContent = '⭐ ⭐'; $('#siraj').appendChild(d);
    $('#siraj').classList.remove('moving');
    return false;
  }
  sfx.hop();
  const ox = state.x, oy = state.y;
  await tween(300, t => {
    const e = ease(t);
    placeSiraj(ox + dx * e, oy + dy * e, C * .55 * Math.sin(Math.PI * t), 1 - .08 * Math.sin(Math.PI * t), 1 + .1 * Math.sin(Math.PI * t));
  });
  state.x = nx; state.y = ny;
  sfx.land(); dust();
  await tween(110, t => placeSiraj(nx, ny, 0, 1 + .14 * (1 - t), 1 - .16 * (1 - t)));
  $('#siraj').classList.remove('moving');
  const key = nx + ',' + ny;
  if (LEVEL[ny][nx] === 's' && !state.got.has(key)) await collect(nx, ny);
  return true;
}

function dust() {
  const [px, py] = cellPos(state.x, state.y);
  for (let i = -1; i <= 1; i += 2) {
    const p = document.createElement('div'); p.className = 'puff';
    p.style.left = px + i * C * .2 - 7 + 'px'; p.style.top = py + R * .1 + 'px'; p.style.setProperty('--dx', i * 16 + 'px'); p.style.zIndex = 300;
    $('#board').appendChild(p); setTimeout(() => p.remove(), 500);
  }
}

async function collect(x, y) {
  state.got.add(x + ',' + y);
  sfx.spark();
  const el = $(`#s-${x}-${y}`);
  const from = el.getBoundingClientRect();
  const slot = $('#sparks').children[state.got.size - 1].getBoundingClientRect();
  const fly = el.cloneNode(true); fly.removeAttribute('id');
  Object.assign(fly.style, { position: 'fixed', left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', transform: 'none', animation: 'none', zIndex: 60, transition: 'all .6s cubic-bezier(.5,-0.4,.6,1)' });
  document.body.appendChild(fly);
  el.remove();
  burst(from.left + from.width / 2, from.top + from.height / 2, 14, ['#ffd23e', '#fff3b0', '#ffb300']);
  requestAnimationFrame(() => Object.assign(fly.style, { left: slot.left + 'px', top: slot.top + 'px', width: slot.width + 'px' }));
  await sleep(600);
  fly.remove();
  renderSparks();
}

function renderSparks() {
  $('#sparks').innerHTML = sparkCells.map((k, i) => `<i class="${i < state.got.size ? 'got' : ''}">${sparkSVG}</i>`).join('');
}

function shakeStage() {
  const b = $('#board');
  b.animate([{ transform: 'translate(-50%,-50%)' }, { transform: 'translate(calc(-50% - 8px),-50%)' }, { transform: 'translate(calc(-50% + 8px),-50%)' }, { transform: 'translate(-50%,-50%)' }], { duration: 300 });
}

async function lightLamp() {
  state.lit = true;
  sfx.win();
  $('#lamp').innerHTML = lampSVG(true); $('#lamp').classList.remove('target');
  $('#glow').classList.add('on');
  await sleep(350);
  $('#stage').classList.add('lit');
  const r = $('#lamp').getBoundingClientRect();
  for (let i = 0; i < 4; i++) setTimeout(() => burst(r.left + r.width / 2 + (Math.random() - .5) * 200, r.top + (Math.random() - .3) * 150, 40, ['#ffd23e', '#ff6b9a', '#4fd1ff', '#7cff8a', '#fff']), i * 260);
  face('happy');
  for (let i = 0; i < 3; i++) {
    await tween(260, t => placeSiraj(state.x, state.y, C * .5 * Math.sin(Math.PI * t), 1, 1 + .1 * Math.sin(Math.PI * t)));
    state.face *= -1;
  }
  await sleep(300);
  $('#win').classList.add('show');
}

/* ---------- الجزيئات ---------- */
const cv = $('#fx'), cx = cv.getContext('2d');
let parts = [];
function fitCanvas() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
fitCanvas(); addEventListener('resize', () => { fitCanvas(); if (!running) renderBoard(); });
function burst(x, y, n, colors) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, life: 1, c: colors[i % colors.length], r: 3 + Math.random() * 4, rot: Math.random() * 6 });
  }
  if (parts.length === n) requestAnimationFrame(loop);
}
function loop() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .98; p.life -= .016; p.rot += .2;
    cx.save(); cx.globalAlpha = Math.max(0, p.life); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
    cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore();
  }
  if (parts.length) requestAnimationFrame(loop); else cx.clearRect(0, 0, innerWidth, innerHeight);
}

/* ---------- الأصوات (مولّدة بالكود) ---------- */
let ac;
function tone(f, d, type = 'sine', v = .12, delay = 0, to) {
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state !== 'running') ac.resume();
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .05);
}
const sfx = {
  tap: () => tone(660, .07, 'triangle', .08, 0, 880),
  hop: () => tone(300, .18, 'sine', .09, 0, 620),
  land: () => tone(180, .08, 'triangle', .07),
  spark: () => [988, 1319, 1568].forEach((f, i) => tone(f, .14, 'sine', .09, i * .06)),
  bump: () => { tone(150, .25, 'sawtooth', .08, 0, 70); tone(520, .3, 'sine', .05, .1, 380); },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .25, 'triangle', .1, i * .11)),
};

/* ---------- البرنامج ---------- */
function say(text, kind = '', mood = 'happy') {
  $('#bubble').className = 'bubble ' + kind;
  $('#bubbleText').textContent = text;
  $('#bubbleFace').innerHTML = sirajSVG(mood, true);
}
function renderSeq(cur = -1, bad = -1) {
  const blocks = program.map((d, i) => `<div class="blk ${COLOR[d]} ${i === cur ? 'now' : ''} ${i === bad ? 'bad' : ''}">${arrowSVG(d)}<code>${d}()</code></div>`).join('');
  $('#seq').innerHTML = blocks + (kidsMode ? '' : '<div class="empty">＋</div>');
  $('#codeView').innerHTML = program.length ? program.map((d, i) => i === cur ? `<span class="cur">${d}()</span>` : `${d}()`).join('<br>') : '# برنامجك يظهر هنا';
}
function renderPal() {
  $('#pal').innerHTML = ['up', 'down', 'left', 'right'].map(d =>
    `<button data-d="${d}" style="background:linear-gradient(${COLOR[d] === 'b' ? '#5aa0ff,var(--blue)' : '#ffb35c,var(--orange)'});box-shadow:0 5px 0 var(--${COLOR[d] === 'b' ? 'blueD' : 'orangeD'})">${arrowSVG(d)}<code>${d}()</code></button>`).join('');
}

$('#pal').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || running) return;
  sfx.tap();
  if (kidsMode) {
    // وضع الصغار: سراج يتحرك فوراً مع كل ضغطة
    running = true;
    clearDizzy();
    program.push(b.dataset.d); renderSeq(program.length - 1);
    await hop(b.dataset.d);
    running = false;
    checkEnd(true);
    return;
  }
  if (program.length >= 12) return;
  program.push(b.dataset.d); renderSeq();
});

function clearDizzy() { document.querySelectorAll('.dizzy').forEach(d => d.remove()); face('happy'); }

async function run() {
  if (running || !program.length) { if (!program.length) say('لنضغط على الأسهم الملونة لنبني برنامجاً!', '', 'wow'); return; }
  running = true; $('#runBtn').textContent = '…'; $('#runBtn').classList.add('stop');
  reset(); clearDizzy(); say('هيّا بنا!', '', 'happy');
  await sleep(300);
  for (let i = 0; i < program.length; i++) {
    renderSeq(i);
    const ok = await hop(program[i]);
    if (!ok) { renderSeq(-1, i); say('آخ! اصطدمت بالصندوق. لا بأس، لنغيّر هذا السهم ونجرّب مرة أخرى.', 'bad', 'dizzy'); return endRun(); }
    if (state.got.size === sparkCells.length && LEVEL[state.y][state.x] === 'L') break;
    await sleep(120);
  }
  renderSeq();
  checkEnd(false);
  endRun();
}
function endRun() { running = false; $('#runBtn').textContent = '▶ شغّل'; $('#runBtn').classList.remove('stop'); }

function checkEnd(live) {
  const atLamp = LEVEL[state.y][state.x] === 'L';
  if (atLamp && state.got.size === sparkCells.length) { say('رائع! جمعنا كل الشرارات! 💡', 'good', 'happy'); lightLamp(); return; }
  if (live) { if (atLamp) say('ما زالت هناك شرارات! لنجمعها أولاً.', '', 'wow'); return; }
  if (atLamp) say('وصلت للمصباح، لكن بقيت شرارات! لنجمعها أولاً.', 'bad', 'sad');
  else if (state.got.size < sparkCells.length) say('انتهى البرنامج وبقيت شرارات. لنضف أسهماً أخرى!', 'bad', 'sad');
  else say('جمعنا الشرارات! بقي أن نصل إلى المصباح.', 'bad', 'wow');
}

$('#runBtn').onclick = () => { sfx.tap(); run(); };
$('#undoBtn').onclick = () => { if (running) return; sfx.tap(); program.pop(); renderSeq(); if (kidsMode) { reset(); } };
$('#clearBtn').onclick = () => { if (running) return; sfx.tap(); program = []; renderSeq(); reset(); clearDizzy(); };
$('#codeBtn').onclick = () => { showCode = !showCode; $('#codeBtn').classList.toggle('on', showCode); $('#codeView').classList.toggle('show', showCode); };
$('#kidsBtn').onclick = () => {
  kidsMode = !kidsMode; $('#kidsBtn').classList.toggle('on', kidsMode);
  program = []; reset(); clearDizzy(); renderSeq();
  $('#runBtn').style.display = kidsMode ? 'none' : '';
  say(kidsMode ? 'اضغط على سهم، وأنا أتحرك فوراً!' : 'اجمع الشرارات الثلاث، ثم أوصلني للمصباح لأُضيئه!', '', 'happy');
};
$('#hintBtn').onclick = () => { sfx.tap(); say('جرّب: يمين، ثم فوق، ثم يمين ثلاث مرات، ثم فوق مرتين.', '', 'wow'); };
$('#againBtn').onclick = () => { $('#win').classList.remove('show'); program = []; reset(); renderSeq(); say('اجمع الشرارات الثلاث، ثم أوصلني للمصباح لأُضيئه!'); };

$('#winFace').innerHTML = sirajSVG('happy', true);
reset(); renderPal(); renderSeq();
say('اجمع الشرارات الثلاث، ثم أوصلني للمصباح لأُضيئه!');
// رمش العيون كل شوية
setInterval(() => { const e = document.querySelector('#sirajSvg .eyes'); if (!e || running) return; e.style.transformOrigin = '60px 57px'; e.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(.1)' }, { transform: 'scaleY(1)' }], { duration: 180 }); }, 3200);
</script>
